name: Auto Build and Release APK

on:
  push:
    branches:
      - main
      - master
    # Or trigger when you push a version tag like v2.9:
    # tags:
    #   - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Generate Release Tag & Version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
          BUILD_NUM=${{ github.run_number }}
          TAG="v${VERSION}.${BUILD_NUM}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Sheildlenz $TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Automated build generated by GitHub Actions.
            - Commit: ${{ github.sha }}
            - Run: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
