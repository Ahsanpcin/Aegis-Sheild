name: Auto Version Bump and Release APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Increment Major Version by 1 and Randomize Patch in build.gradle.kts
        run: |
          # Extract current versionCode and versionName
          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          NEW_CODE=$((CURRENT_CODE + 1))
          
          CURRENT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          # Extract the integer before the dot (e.g., "2.8" -> 2)
          CURRENT_MAJOR=$(echo $CURRENT_NAME | cut -d. -f1)
          NEW_MAJOR=$((CURRENT_MAJOR + 1))
          
          # Generate a random number between 10 and 99 for after the dot
          RANDOM_PATCH=$(( ( RANDOM % 90 )  + 10 ))
          
          NEW_NAME="${NEW_MAJOR}.${RANDOM_PATCH}"
          
          echo "Bumping version: v$CURRENT_NAME ($CURRENT_CODE) -> v$NEW_NAME ($NEW_CODE)"
          
          # Update build.gradle.kts
          sed -i "s/versionCode = $CURRENT_CODE/versionCode = $NEW_CODE/g" app/build.gradle.kts
          sed -i "s/versionName = \"$CURRENT_NAME\"/versionName = \"$NEW_NAME\"/g" app/build.gradle.kts
          
          echo "NEW_NAME=$NEW_NAME" >> $GITHUB_ENV
          echo "NEW_CODE=$NEW_CODE" >> $GITHUB_ENV

      - name: Commit Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump version to v${{ env.NEW_NAME }} (Code ${{ env.NEW_CODE }}) [skip ci]"
          git push

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_NAME }}
          name: Sheildlenz v${{ env.NEW_NAME }} (Build ${{ env.NEW_CODE }})
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Automated release v${{ env.NEW_NAME }} (Code ${{ env.NEW_CODE }}).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
